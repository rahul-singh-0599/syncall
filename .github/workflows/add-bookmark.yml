name: Add Bookmark to JSON

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  add-bookmark:
    # Security: only process issues opened by the repository owner with the 'bookmark' label
    if: |
      github.event.issue.user.login == github.repository_owner &&
      contains(github.event.issue.labels.*.name, 'bookmark')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Parse issue and update bookmarks.json
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          node -e '
            const fs = require("fs");
            const body = process.env.ISSUE_BODY || "";

            // Extract field value by its Markdown heading from the Issue Form
            function getField(heading) {
              const regex = new RegExp(`### ${heading}\\s*\\n\\s*([\\s\\S]*?)(?=\\n### |$)`);
              const match = body.match(regex);
              if (!match) return "";
              const val = match[1].trim();
              return val === "_No response_" ? "" : val;
            }

            const name = getField("Name");
            const url = getField("URL");
            const description = getField("Description");
            const rawTags = getField("Tags");
            const tags = rawTags
              ? rawTags.split(",").map(t => t.trim()).filter(Boolean)
              : [];

            if (!name || !url) {
              console.error("Missing required Name or URL field.");
              process.exit(1);
            }

            const filePath = "bookmarks.json";
            const bookmarks = fs.existsSync(filePath)
              ? JSON.parse(fs.readFileSync(filePath, "utf8"))
              : [];

            // Prepend so newest bookmarks appear at the top
            bookmarks.unshift({ name, description, url, tags });
            fs.writeFileSync(filePath, JSON.stringify(bookmarks, null, 2) + "\n");
          '

      - name: Commit and push updated bookmarks.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bookmarks.json
          git commit -m "Add bookmark from issue #${{ github.event.issue.number }}"
          git push

      - name: Close issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue close "${{ github.event.issue.number }}" \
            --comment "Bookmark added to \`bookmarks.json\` and queued for GitHub Pages deployment."