name: Add Bookmark
description: Add a new link to bookmarks.json
title: "Bookmark: "
labels: ["bookmark"]
body:
  - type: input
    id: name
    attributes:
      label: Name
      placeholder: "e.g., FastAPI Documentation"
    validations:
      required: true

  - type: input
    id: url
    attributes:
      label: URL
      placeholder: "https://..."
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      placeholder: "Short summary or keywords for fuzzy search"
    validations:
      required: false

  - type: input
    id: tags
    attributes:
      label: Tags
      description: Comma-separated tags
      placeholder: "azure, docs, python"
    validations:
      required: false