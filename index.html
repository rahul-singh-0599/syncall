<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bookmarks</title>
<style>
  :root {
    --bg: #ffffff;
    --surface: #f6f8fa;
    --border: #d0d7de;
    --text: #1f2328;
    --muted: #656d76;
    --accent: #0969da;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
    }
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    max-width: 760px;
    margin: 0 auto;
    padding: 2rem 1rem;
    line-height: 1.5;
  }
  .search-box {
    width: 100%;
    padding: 0.85rem 1rem;
    font-size: 1rem;
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    outline: none;
  }
  .search-box:focus { border-color: var(--accent); }
  .meta {
    font-size: 0.85rem;
    color: var(--muted);
    margin: 0.5rem 0 1.5rem;
  }
  .list { display: flex; flex-direction: column; gap: 0.75rem; }
  .card {
    display: block;
    text-decoration: none;
    color: inherit;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1rem;
    transition: border-color 0.15s;
  }
  .card:hover { border-color: var(--accent); }
  .card-title { font-weight: 600; color: var(--accent); margin-bottom: 0.25rem; }
  .card-desc { font-size: 0.92rem; color: var(--muted); margin-bottom: 0.5rem; }
  .card-url { font-size: 0.8rem; color: var(--muted); word-break: break-all; }
  .tags { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.5rem; }
  .tag {
    font-size: 0.75rem;
    padding: 0.15rem 0.5rem;
    border-radius: 999px;
    border: 1px solid var(--border);
    color: var(--muted);
  }
</style>
</head>
<body>
<input
  id="search"
  class="search-box"
  type="text"
  placeholder="Search bookmarks... (press / to focus)"
  autocomplete="off"
  autofocus
/>
<div id="meta" class="meta">Loading bookmarks...</div>
<div id="results" class="list"></div>

<!-- Load Fuse.js directly from CDN -->
<script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.min.js"></script>
<script>
  const searchInput = document.getElementById('search');
  const resultsEl = document.getElementById('results');
  const metaEl = document.getElementById('meta');

  let bookmarks = [];
  let fuse = null;

  // Escape HTML to prevent accidental rendering issues
  function escapeHtml(str = '') {
    return str.replace(/[&<>"']/g, m => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[m]));
  }

  function render(items) {
    metaEl.textContent = `${items.length} bookmark${items.length === 1 ? '' : 's'}`;
    if (!items.length) {
      resultsEl.innerHTML = '<div class="meta">No matching bookmarks found.</div>';
      return;
    }

    resultsEl.innerHTML = items.map(b => `
      <a class="card" href="${escapeHtml(b.url)}" target="_blank" rel="noopener noreferrer">
        <div class="card-title">${escapeHtml(b.name)}</div>
        <div class="card-desc">${escapeHtml(b.description)}</div>
        <div class="card-url">${escapeHtml(b.url)}</div>
        ${b.tags?.length ? `<div class="tags">${b.tags.map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('')}</div>` : ''}
      </a>
    `).join('');
  }

  async function init() {
    try {
      const res = await fetch('./bookmarks.json');
      bookmarks = await res.json();

      fuse = new Fuse(bookmarks, {
        keys: [
          { name: 'name', weight: 0.5 },
          { name: 'tags', weight: 0.3 },
          { name: 'description', weight: 0.2 }
        ],
        threshold: 0.35,      // 0.0 = exact match, 1.0 = match anything
        ignoreLocation: true  // Match words anywhere in long descriptions
      });

      render(bookmarks);
    } catch (err) {
      metaEl.textContent = 'Failed to load bookmarks.json. Make sure you are serving this via a web server or GitHub Pages.';
    }
  }

  searchInput.addEventListener('input', (e) => {
    const query = e.target.value.trim();
    if (!query) {
      render(bookmarks);
      return;
    }
    const matches = fuse.search(query).map(r => r.item);
    render(matches);
  });

  // Keyboard shortcuts: '/' to focus search, 'Escape' to clear
  document.addEventListener('keydown', (e) => {
    if (e.key === '/' && document.activeElement !== searchInput) {
      e.preventDefault();
      searchInput.focus();
    } else if (e.key === 'Escape' && document.activeElement === searchInput) {
      searchInput.value = '';
      render(bookmarks);
    }
  });

  init();
</script>
</body>
</html>
